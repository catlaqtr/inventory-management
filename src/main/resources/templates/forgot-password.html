<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Inventory Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-page">
    <div class="auth-panel auth-panel-brand">
        <div class="auth-brand-block">
            <div class="auth-logo">
                <span class="brand-mark" aria-hidden="true">
                    <svg class="brand-cart" viewBox="0 0 24 24">
                        <circle cx="9" cy="20" r="1.6" fill="#e11d2e"/>
                        <circle cx="18" cy="20" r="1.6" fill="#e11d2e"/>
                        <path d="M3 4h2l2.2 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.2L21 8H7"
                              fill="none" stroke="#e11d2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <span class="auth-logo-text">I-nvy</span>
            </div>
            <h1 class="auth-hero-title">Reset your<br>admin access.</h1>
            <p class="auth-hero-text">
                Company admins can set a new password by confirming company name and username.
            </p>
        </div>
    </div>

    <div class="auth-panel auth-panel-form">
        <div class="auth-card modern">
            <p class="auth-kicker">Account recovery</p>
            <h2>Forgot password</h2>
            <p class="auth-subtitle">For company admins only</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/forgot-password}" th:object="${user}" method="post" class="auth-form">
                <div class="form-group">
                    <label for="companyName">Company Name</label>
                    <div class="input-with-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 20V9l8-5 8 5v11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                            <path d="M9 20v-6h6v6" fill="none" stroke="currentColor" stroke-width="1.8"/>
                        </svg>
                        <input id="companyName" type="text" th:field="*{companyName}" placeholder="Your company name" required autofocus />
                    </div>
                </div>
                <div class="form-group">
                    <label for="username">Admin Username</label>
                    <div class="input-with-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M5 19c0-3.2 3-5.2 7-5.2s7 2 7 5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                        <input id="username" type="text" th:field="*{username}" placeholder="Admin username" required />
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">New Password</label>
                    <div class="input-with-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                        <input id="password" type="password" th:field="*{password}" placeholder="Create a new password" required minlength="6" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-with-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                        <input id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="Confirm new password" required minlength="6" />
                    </div>
                </div>
                <button type="submit" class="btn-primary auth-submit">Reset Password</button>
            </form>

            <p class="auth-footer">
                Remembered it?
                <a th:href="@{/login}">Back to sign in</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>

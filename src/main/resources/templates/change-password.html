<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Change Password - Inventory Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">

<div th:replace="~{fragments/navbar :: sidebar('users')}"></div>

<div class="main-content form-page">
    <div class="header-bar">
        <div>
            <p class="page-kicker">Security</p>
            <h1>Change Password</h1>
            <p class="page-subtitle">
                Update password for
                <strong th:text="${targetUser.username}">user</strong>
            </p>
        </div>
        <a th:href="@{/users}" class="btn-link">← Back to Users</a>
    </div>

    <div class="form-center">
        <div class="form-card">
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <p class="hint">
                Role:
                <strong th:text="${targetUser.role}">ROLE</strong>
            </p>

            <form th:action="@{/users/{id}/change-password(id=${targetUser.id})}" th:object="${user}" method="post">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" th:field="*{password}" required minlength="6" />
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" th:field="*{confirmPassword}" required minlength="6" />
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary" style="width:auto; padding:12px 28px;">
                        Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Inventory Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="app-body">

<div th:replace="~{fragments/navbar :: sidebar('dashboard')}"></div>

<div class="main-content dashboard-page">
    <div class="header-bar dashboard-header">
        <div>
            <p class="page-kicker">Overview</p>
            <h1>Dashboard</h1>
            <p class="page-subtitle">
                Company
                <strong th:text="${companyName}">Company</strong>
            </p>
        </div>
        <div class="user-badge modern">
            <span class="user-badge-avatar" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="12" cy="8" r="3.2"/>
                    <path d="M5 19c0-3.2 3-5.2 7-5.2s7 2 7 5.2" stroke-linecap="round"/>
                </svg>
            </span>
            <span class="user-badge-copy">
                <span class="user-badge-name" th:text="${username}">User</span>
                <span class="user-badge-role" th:text="${role}">ROLE</span>
            </span>
        </div>
    </div>

    <div class="metrics-grid dashboard-metrics">
        <div class="metric-card modern">
            <div class="metric-card-top">
                <h3>Current Staff</h3>
                <span class="metric-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <circle cx="9" cy="8" r="3"/><path d="M3 19c0-3 2.5-5 6-5s6 2 6 5"/>
                        <circle cx="17" cy="9" r="2.2"/><path d="M16 19c0-2 1.5-3.5 4-3.5"/>
                    </svg>
                </span>
            </div>
            <div class="metric-number" th:text="${totalStaff}">0</div>
        </div>

        <div class="metric-card modern">
            <div class="metric-card-top">
                <h3>Total Sales</h3>
                <span class="metric-icon accent">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/>
                        <path d="M3 4h2l2.2 11h10.3l2-7H7"/>
                    </svg>
                </span>
            </div>
            <div class="metric-number" th:text="${#numbers.formatDecimal(totalSales, 1, 2)}">0.00</div>
        </div>

        <div class="metric-card modern">
            <div class="metric-card-top">
                <h3>Tax Collected</h3>
                <span class="metric-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <rect x="3" y="6" width="18" height="12" rx="2"/>
                        <path d="M3 10h18M7 15h4"/>
                    </svg>
                </span>
            </div>
            <div class="metric-number" th:text="${#numbers.formatDecimal(totalTax, 1, 2)}">0.00</div>
        </div>

        <div class="metric-card modern">
            <div class="metric-card-top">
                <h3>Total Stock</h3>
                <span class="metric-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <rect x="4" y="4" width="16" height="4" rx="1"/>
                        <rect x="4" y="10" width="16" height="4" rx="1"/>
                        <rect x="4" y="16" width="16" height="4" rx="1"/>
                    </svg>
                </span>
            </div>
            <div class="metric-number" th:text="${totalStock}">0</div>
        </div>

        <div class="metric-card modern">
            <div class="metric-card-top">
                <h3>Low Stock Items</h3>
                <span class="metric-icon warn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M12 3l9 16H3L12 3z"/><path d="M12 10v4M12 17h.01"/>
                    </svg>
                </span>
            </div>
            <div class="metric-number" th:text="${lowStockCount}">0</div>
        </div>

        <div class="metric-card modern">
            <div class="metric-card-top">
                <h3>Total Invoices</h3>
                <span class="metric-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M7 3h8l4 4v14H7V3z"/><path d="M15 3v4h4M9 12h8M9 16h6"/>
                    </svg>
                </span>
            </div>
            <div class="metric-number" th:text="${totalInvoices}">0</div>
        </div>
    </div>

    <div class="chart-card modern">
        <div class="chart-card-header">
            <p class="page-kicker">Analytics</p>
            <h2>Monthly Sales Data</h2>
            <p class="hint">Sales totals and tax collected over the last 12 months</p>
        </div>
        <div class="chart-wrap">
            <canvas id="monthlySalesChart"></canvas>
        </div>
    </div>
</div>

<script th:inline="javascript">
    (function () {
        const monthlyData = /*[[${monthlySalesJson}]]*/ '[]';
        const points = typeof monthlyData === 'string' ? JSON.parse(monthlyData) : monthlyData;

        const labels = points.map(function (p) { return p.label; });
        const sales = points.map(function (p) { return Number(p.sales || 0); });
        const tax = points.map(function (p) { return Number(p.tax || 0); });

        const ctx = document.getElementById('monthlySalesChart');
        if (!ctx) {
            return;
        }

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        type: 'bar',
                        label: 'Sales',
                        data: sales,
                        backgroundColor: 'rgba(15, 23, 42, 0.82)',
                        hoverBackgroundColor: 'rgba(225, 29, 46, 0.85)',
                        borderRadius: 8,
                        order: 2
                    },
                    {
                        type: 'line',
                        label: 'Tax',
                        data: tax,
                        borderColor: '#e11d2e',
                        backgroundColor: 'rgba(225, 29, 46, 0.12)',
                        fill: true,
                        tension: 0.35,
                        pointRadius: 4,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#e11d2e',
                        pointBorderWidth: 2,
                        order: 1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            boxWidth: 12,
                            usePointStyle: true,
                            font: { size: 12, family: "'Plus Jakarta Sans', sans-serif" },
                            color: '#64748b'
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { font: { size: 11, family: "'Plus Jakarta Sans', sans-serif" }, color: '#94a3b8' },
                        border: { display: false }
                    },
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(148, 163, 184, 0.18)' },
                        ticks: {
                            font: { size: 11, family: "'Plus Jakarta Sans', sans-serif" },
                            color: '#94a3b8',
                            callback: function (value) {
                                return '$' + value;
                            }
                        },
                        border: { display: false }
                    }
                }
            }
        });
    })();
</script>

</body>
</html>

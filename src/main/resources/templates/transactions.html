<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transactions - Inventory Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">

<div th:replace="~{fragments/navbar :: sidebar('transactions')}"></div>

<div class="main-content">
    <div class="header-bar">
        <div>
            <p class="page-kicker">Stock movement</p>
            <h1>Transactions</h1>
            <p class="page-subtitle">Stock in and stock out history</p>
        </div>
        <a th:href="@{/transactions/add}" class="btn-action">+ Record Transaction</a>
    </div>

    <div class="table-card">
        <table>
            <thead>
            <tr>
                <th>Date</th>
                <th>Product</th>
                <th>Type</th>
                <th>Quantity</th>
                <th>Note</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${transactions == null or transactions.isEmpty()}">
                <td colspan="5" class="empty-row">No transactions recorded yet.</td>
            </tr>
            <tr th:each="tx : ${transactions}">
                <td th:text="${tx.formattedTransactionDate}">Date</td>
                <td th:text="${tx.product.name}">Product</td>
                <td>
                    <span class="badge"
                          th:classappend="${tx.type == 'STOCK_IN'} ? 'badge-in' : 'badge-out'"
                          th:text="${tx.type}">TYPE</span>
                </td>
                <td th:text="${tx.quantity}">0</td>
                <td th:text="${tx.note}">Note</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>

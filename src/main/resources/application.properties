# MySQL Connection Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Driver & Hibernate Settings
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automatically update MySQL tables based on JPA entities
spring.jpa.hibernate.ddl-auto=update

# Show formatted SQL queries in console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true